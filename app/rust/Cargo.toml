[package]
name = "scanbridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Flutter 与识别核心之间的桥: 一组页图 -> docx/xlsx"
license = "Apache-2.0"

[lib]
# staticlib 给 iOS(链进 Runner), cdylib 给 Android(打成 .so),
# rlib 留着让 cargo test 和 flutter_rust_bridge 的 codegen 能正常读它
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# 识别与版面重建核心, 直接吃桌面版那个仓库的 v0.1.6
# default-features = false 是关掉 gui: eframe/wgpu 那一坨在手机上一点用没有
scannedpdf2doc = { git = "https://github.com/cobraliu/ScannedPdf2Doc-rust", tag = "v0.1.6", default-features = false }
flutter_rust_bridge = "=2.11.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev]
# cargokit 把 Flutter 的 debug 直接映射成 cargo 的 debug, 而未优化的推理
# 一页要跑几十秒, debug 版就没法用了。识别这条路上的热点全在依赖里
# (ort / image / 我们自己的重采样), 所以依赖一律按 3 优化, 本 crate 留 1 ——
# 这样 UI 侧还能 hot reload, 识别又是能忍的速度
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# 不设 panic = "abort": 手机上出问题本来就难查, 别把 panic 栈这唯一的线索砍掉
